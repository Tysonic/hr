# Production, on the server TyHR shares with Tycount (MyBiz); see docs/deploy.md:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Required variables: TYHR_DOMAIN, TYHR_DB_PASSWORD, TYHR_SECRETS_KEY, AUTH_URL, KC_PROVISIONER_SECRET.
#
# TyHR borrows three of Tycount's services, which join the "tyhr-edge" network through deploy/tycount.override.yml:
# - Caddy is the one public entrance (deploy/caddy/sites/tyhr.caddy).
# - Keycloak signs people in (realm MyBiz).
# - Postgres holds TyHR's database: "tyhr", owned by its own "tyhr" login (deploy/postgres/create-db.sh).
# This stack is only TyHR's two containers, and nothing is published.
#
# Service names start with tyhr- on purpose: Tycount's Caddy is on this network and on Tycount's own, where "api" is
# Tycount's. A service called "api" here would be given some of Tycount's traffic.
name: tyhr

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  tyhr-api:
    build: ./api
    restart: unless-stopped
    logging: *logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Tycount's Postgres, whose connections every product shares: hence the pool limit. If it isn't reachable, the
      # API retries for a minute, stops, and Docker starts it again.
      ConnectionStrings__Default: Host=postgres;Database=tyhr;Username=tyhr;Password=${TYHR_DB_PASSWORD:?};Maximum Pool Size=30
      Database__MigrateOnStartup: "true"
      # Tycount's Keycloak over tyhr-edge: Tycount's Caddy doesn't let the admin API (used for invitations) through
      # from outside. Tokens still name the public address as their issuer, which Keycloak itself reports here.
      Auth__Authority: http://keycloak:8080/realms/MyBiz
      Auth__RequireHttpsMetadata: "false"
      Auth__Audience: tyhr-api
      # MyBiz's operator company: its PlatformAdmin role only counts for that company's users. Empty = anywhere.
      Auth__PlatformTenant: ${PLATFORM_TENANT:-}
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__Realm: MyBiz
      Keycloak__ProvisionerSecret: ${KC_PROVISIONER_SECRET:?}
      Keycloak__WebUrl: https://${TYHR_DOMAIN:?}/
      Cors__Origins__0: https://${TYHR_DOMAIN:?}
      # Encrypts ID, bank and mobile-money numbers: openssl rand -base64 32. Back it up; losing it loses those fields.
      Secrets__Key: ${TYHR_SECRETS_KEY:?}
      Storage__Path: /files
      # Outgoing mail. Empty SMTP_HOST sends nothing (reminders wait until mail is configured).
      Mail__Host: ${SMTP_HOST:-}
      Mail__Port: ${SMTP_PORT:-587}
      Mail__Security: ${SMTP_SECURITY:-StartTls}
      Mail__Username: ${SMTP_USERNAME:-}
      Mail__Password: ${SMTP_PASSWORD:-}
      Mail__From: ${MAIL_FROM:-TyHR <no-reply@tyhr.local>}
    volumes:
      - dataprotection-keys:/keys
      - files:/files
    networks: [edge]

  tyhr-web:
    build:
      context: ./web
      args:
        # The address browsers use.
        VITE_OIDC_AUTHORITY: ${AUTH_URL:?}/realms/MyBiz
    restart: unless-stopped
    logging: *logging
    networks: [edge]

volumes:
  dataprotection-keys:
  files:

networks:
  # A fixed name, so Tycount's stack can join it. Its own network, so TyHR and the company website can't reach each other.
  edge:
    name: tyhr-edge
