# Used by the TYCOUNT stack, not this one: lets Tycount's Caddy serve TyHR, Tycount's Keycloak sign its users in, and
# Tycount's Postgres hold its database (its own login and database). On the server, add it LAST to COMPOSE_FILE in
# /opt/tycount/Tycount/.env, after the company website's:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml:/opt/tysoft-website/deploy/tycount-caddy.override.yml:/opt/tyhr/deploy/tycount.override.yml
# Then, from /opt/tycount/Tycount: docker compose up -d caddy keycloak postgres   (recreates them; see docs/deploy.md)
#
# Start TyHR's stack first: it creates the tyhr-edge network this file joins.
#
# /etc/caddy/sites is where Tycount's Caddyfile looks for other sites, and only one folder can be mounted there. The
# website's override mounts its own; this one takes its place (which is why it goes last) and brings the website's
# along: deploy/caddy/sites/tysoft-website.caddy imports it from /etc/caddy/tysoft-website.
services:
  caddy:
    networks: [default, tyhr-edge]
    environment:
      TYHR_DOMAIN: ${TYHR_DOMAIN:-hr.tysoftltd.com}
    volumes:
      - ${TYHR_DIR:-/opt/tyhr}/deploy/caddy/sites:/etc/caddy/sites:ro
      - ${TYSOFT_WEBSITE_DIR:-/opt/tysoft-website}/deploy/caddy:/etc/caddy/tysoft-website:ro

  keycloak:
    networks: [default, tyhr-edge]

  postgres:
    networks: [default, tyhr-edge]

networks:
  tyhr-edge:
    external: true
