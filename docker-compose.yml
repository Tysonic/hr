# Local development services. The API and web app run on the host (dotnet run / npm run dev); see README.md.
# Postgres is the shared Tysoft development server (localhost:5432), not started here: deploy/postgres/setup-dev.sh
# creates TyHR's database on it. Other ports are offset from the other Tysoft products (sacco, Tycount) so their stacks can run side by side.
# Sign-in uses Tycount's Keycloak (shared realm "tysoft-apps", http://localhost:8082): cd ../erp/Tycount && docker compose up -d keycloak,
# then deploy/keycloak/setup.sh --dev-users.
name: tyhr

services:
  # Catches TyHR's own email (notifications): http://localhost:8025. Keycloak's emails go through the realm's SMTP.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"
